version: "3.8"

services:
  # Postgres, Redis, MinIO, and Qdrant in dev mode
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doctor_patient_db
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - dev_qdrant_data:/qdrant/storage

volumes:
  dev_postgres_data:
  dev_minio_data:
  dev_qdrant_data:
