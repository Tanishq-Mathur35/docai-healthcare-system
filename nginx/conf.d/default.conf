upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:5000;
}

upstream minio_upstream {
    server minio:9000;
}

upstream python_service_upstream {
    server python-service:8000;
}

server {
    listen 80;
    server_name localhost;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. API routes -> Backend Node.js
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 2. WebSocket Realtime Chat -> Backend Socket.IO
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Direct MinIO file storage proxy (public document access)
    location /storage/ {
        rewrite ^/storage/(.*) /doctor-patient-files/$1 break;
        proxy_pass http://minio_upstream;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Internal Python AI microservice access
    location /ai-service/ {
        rewrite ^/ai-service/(.*) /$1 break;
        proxy_pass http://python_service_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # 5. Global Health check
    location /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # 6. Frontend SPA
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
